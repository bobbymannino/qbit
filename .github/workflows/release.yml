name: Release

on:
  push:
    tags: ["v*"]
  # Caches saved on a tag can only be used by that tag, so rebuild on main weekly (or by
  # hand) to keep a cache every release can restore. Those runs don't publish anything.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            # Cross-compiled on the Apple Silicon runner; the macOS SDK covers both.
            target: x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build app and disk image
        run: scripts/bundle-macos.sh "${GITHUB_REF_NAME}"
        env:
          QBIT_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: qBit-macos-${{ matrix.arch }}
          # The disk image, plus the app as a tarball for in-app updates; not the bare
          # .app, as artifacts don't keep file permissions, which would leave the app's
          # binary non-executable.
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            # Native ARM runner, so no cross-compiling toolchain or libraries are needed.
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      # Headers for gpui's Wayland/X11 windowing, fonts and the Vulkan renderer.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libvulkan-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build tarball
        run: scripts/bundle-linux.sh "${GITHUB_REF_NAME}"
        env:
          QBIT_TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: qBit-linux-${{ matrix.arch }}
          # A tarball keeps the binary executable, which artifacts alone wouldn't.
          path: dist/*.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            # Native ARM runner, so no cross-compiling toolchain is needed.
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build zip
        shell: pwsh
        run: scripts/bundle-windows.ps1 "$env:GITHUB_REF_NAME"
        env:
          QBIT_TARGET: ${{ matrix.target }}
          # Use aws-lc's prebuilt assembly rather than needing NASM on the runner.
          AWS_LC_SYS_PREBUILT_NASM: "1"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: qBit-windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [build-macos, build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # so the previous tag can be detected

      - uses: bobbymannino/github-release-action@v1

      - uses: actions/download-artifact@v8
        with:
          pattern: qBit-*
          merge-multiple: true
          path: dist

      - name: Attach the builds to the release
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
