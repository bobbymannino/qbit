[workspace]
members = ["crates/*"]

[workspace.package]
version = "0.3.1"
rust-version = "1.95"
edition = "2024"

[workspace.dependencies]
flate2 = "1.1"
gpui-kit = "0.9.1"
keyring = "4.2"
regex = "1.13"
reqwest = { version = "0.13", features = ["json", "form", "cookies"] }
serde = { version = "1", features = ["derive"] }
self-replace = "1.5"
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread"] }
# Only for unpacking Windows updates, which are deflate-compressed.
zip = { version = "9.5", default-features = false, features = ["deflate"] }
gui = { path = "crates/gui" }
qbittorrent = { path = "crates/qbittorrent" }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

[package]
name = "qbit"
version.workspace = true
rust-version.workspace = true
edition.workspace = true

[dependencies]
gui.workspace = true

[build-dependencies]
embed-resource = "3.0"

[lints]
workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
